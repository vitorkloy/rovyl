name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Chamado pelo sync-upstream (push com GITHUB_TOKEN não dispara outros workflows).
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (vite + electron-builder, sem publicar)
        run: |
          npm run build
          node scripts/run-electron-builder.mjs --win nsis --publish never
        env:
          ZENITH_BUILD_OUTPUT: build-out
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: rovyl-windows
          path: |
            build-out/Rovyl.exe
            build-out/Rovyl.exe.blockmap
            build-out/latest.yml
          if-no-files-found: error

  release:
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rovyl-windows
          path: dist
      - name: Publish GitHub Release (uma vez por tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG já existe — nada a fazer."; exit 0
          fi
          gh release create "$TAG" dist/Rovyl.exe dist/Rovyl.exe.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "Rovyl $TAG" --generate-notes --verify-tag
