name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (vite + electron-builder, sem publicar)
        run: |
          npm run build
          node scripts/run-electron-builder.mjs --win nsis --publish never
        env:
          ZENITH_BUILD_OUTPUT: build-out
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: rovyl-windows
          path: |
            build-out/*.exe
            build-out/*.blockmap
            build-out/latest.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rovyl-windows
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="manual-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Rovyl $TAG" --generate-notes --target "$GITHUB_SHA"
